parameters:
- name: oneLocEnabled
  default: false
  type: boolean
- name: microbuildUseESRP
  default: true
  type: boolean

stages:
- stage: build
  displayName: Build
  jobs:
  - ${{ if eq(parameters.oneLocEnabled, true) }}:
    - template: /eng/common/templates-official/job/onelocbuild.yml@self
      parameters:
        MirrorRepo: arcade
        LclSource: lclFilesFromPackage
        LclPackageId: 'LCL-JUNO-PROD-ARCADE'
  - template: /eng/common/templates-official/jobs/jobs.yml@self
    parameters:
      artifacts:
        publish:
          artifacts: false
          logs: true
          manifests: true
      enableMicrobuild: true
      microbuildUseESRP: ${{ parameters.microbuildUseESRP }}
      enableSourceIndex: false
      enableSourceBuild: false
      workspace:
        clean: all
      jobs:
      - job: Windows_NT
        timeoutInMinutes: 90
        strategy:
          matrix:
            Build_Release:
              _BuildConfig: Release
        preSteps:
        - checkout: self
          fetchDepth: 0
          clean: true
        steps:
        - script: eng\common\cibuild.cmd
            -configuration $(_BuildConfig)
            -prepareMachine
            $(_InternalBuildArgs)
            /p:Test=false
          displayName: Windows Build / Publish

        # Non-dry-run real signing test using ESRP CLI provider.
        # Uses the RecursiveSigning CLI DLL as test input (not yet signed at this point).
        - template: /eng/pipelines/templates/steps/recursive-sign.yml@self
          parameters:
            configPath: 'src/Microsoft.DotNet.RecursiveSigning.Cli/signing-config-cli.json'
            inputs: '$(System.DefaultWorkingDirectory)/artifacts/bin/Microsoft.DotNet.RecursiveSigning.Cli/$(_BuildConfig)/net10.0/Microsoft.DotNet.RecursiveSigning.Cli.dll'
            provider: 'esrp-cli'
            displayNameSuffix: ' (ESRP CLI)'

        # Non-dry-run real signing test using ESRPClient.exe provider.
        # Uses EsrpClient.exe from MicroBuild signing plugin (auto-discovered).
        # Uses the RecursiveSigning library DLL (different file, not yet signed).
        # Note: ESRPClient.exe uses cert-based auth, and MicroBuild installs PME certs.
        - template: /eng/pipelines/templates/steps/recursive-sign.yml@self
          parameters:
            configPath: 'src/Microsoft.DotNet.RecursiveSigning.Cli/signing-config-client.json'
            inputs: '$(System.DefaultWorkingDirectory)/artifacts/packages/**/*.nupkg'
            provider: 'esrp-client'
            esrpId: 'dec434ad-6bd4-4a20-b400-4bf6db7fc3fb'
            esrpClientId: 'c4428c30-2253-4654-ab5e-cdb9ff6d850c'
            displayNameSuffix: ' (ESRPClient.exe)'

        - powershell: |
            ./eng/common/dotnet.ps1 nuget push "$(System.DefaultWorkingDirectory)/artifacts/packages/Release/NonShipping/Microsoft.DotNet.RecursiveSigning.*.nupkg" --source https://pkgs.dev.azure.com/dnceng/internal/_packaging/dotnet-sign-test-feed/nuget/v3/index.json --api-key az

- stage: ValidateSdk
  displayName: Validate Arcade SDK
  dependsOn: build
  jobs:
  - template: /eng/validate-sdk.yml@self
    parameters:
      microbuildUseESRP: ${{ parameters.microbuildUseESRP }}
      buildArgs: -configuration $(_BuildConfig)
        -prepareMachine
        $(_InternalBuildArgs)
        /p:Test=false

- template: /eng/common/templates-official/post-build/post-build.yml@self
  parameters:
    publishingInfraVersion: 3
    # signing validation will not run, even if the below value is 'true', if the 'PostBuildSign' variable is set to 'true'
    enableSigningValidation: false
    # Sourcelink validation isn't passing for Arcade due to some regressions. This should be
    # enabled back once this issue is resolved: https://github.com/dotnet/arcade/issues/2912
    enableSourceLinkValidation: false
    publishDependsOn:
    - Validate
    - ValidateSdk
