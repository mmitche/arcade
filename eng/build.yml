parameters:
- name: oneLocEnabled
  default: false
  type: boolean
- name: microbuildUseESRP
  default: false
  type: boolean

stages:
- stage: build
  displayName: Build
  jobs:
  - ${{ if eq(parameters.oneLocEnabled, true) }}:
    - template: /eng/common/templates-official/job/onelocbuild.yml@self
      parameters:
        MirrorRepo: arcade
        LclSource: lclFilesFromPackage
        LclPackageId: 'LCL-JUNO-PROD-ARCADE'
  - template: /eng/common/templates-official/jobs/jobs.yml@self
    parameters:
      artifacts:
        publish:
          artifacts: true
          logs: true
          manifests: true
      enableMicrobuild: true
      microbuildUseESRP: ${{ parameters.microbuildUseESRP }}
      enableSourceIndex: true
      enableSourceBuild: true
      workspace:
        clean: all
      jobs:
      - job: Windows_NT
        timeoutInMinutes: 90
        strategy:
          matrix:
            Build_Release:
              _BuildConfig: Release
        preSteps:
        - checkout: self
          fetchDepth: 0
          clean: true
        steps:
        - script: eng\common\cibuild.cmd
            -configuration $(_BuildConfig)
            -prepareMachine
            $(_InternalBuildArgs)
            /p:Test=false
          displayName: Windows Build / Publish

        - powershell: |
            # Test recursive signing CLI with ESRP CLI provider (dry-run)
            $cliDll = "$(System.DefaultWorkingDirectory)\artifacts\bin\Microsoft.DotNet.RecursiveSigning.Cli\$(_BuildConfig)\net10.0\Microsoft.DotNet.RecursiveSigning.Cli.dll"
            $signingConfig = "$(System.DefaultWorkingDirectory)\src\Microsoft.DotNet.RecursiveSigning.Cli\signing-config.json"
            # Use a DLL that isn't already signed - the CLI itself works
            $testFile = $cliDll
            Write-Host "Testing recursive signing CLI (ESRP CLI provider, dry-run) with: $testFile"
            & .dotnet\dotnet.exe $cliDll --config $signingConfig --input $testFile --esrp --dry-run --verbose
            if ($LASTEXITCODE -ne 0) { throw "Recursive signing dry-run (ESRP CLI) failed with exit code $LASTEXITCODE" }
          displayName: 'Test: Recursive Signing CLI (ESRP CLI dry-run)'

        - powershell: |
            # Test recursive signing CLI with ESRPClient.exe provider (dry-run)
            $cliDll = "$(System.DefaultWorkingDirectory)\artifacts\bin\Microsoft.DotNet.RecursiveSigning.Cli\$(_BuildConfig)\net10.0\Microsoft.DotNet.RecursiveSigning.Cli.dll"
            $signingConfig = "$(System.DefaultWorkingDirectory)\src\Microsoft.DotNet.RecursiveSigning.Cli\signing-config.json"
            # Use a different DLL for the second test to show both providers work
            $testFile = "$(System.DefaultWorkingDirectory)\artifacts\bin\Microsoft.DotNet.RecursiveSigning\$(_BuildConfig)\net10.0\Microsoft.DotNet.RecursiveSigning.dll"
            Write-Host "Testing recursive signing CLI (ESRPClient.exe provider, dry-run) with: $testFile"
            & .dotnet\dotnet.exe $cliDll --config $signingConfig --input $testFile --esrp-client --dry-run --verbose
            if ($LASTEXITCODE -ne 0) { throw "Recursive signing dry-run (ESRPClient.exe) failed with exit code $LASTEXITCODE" }
          displayName: 'Test: Recursive Signing CLI (ESRPClient.exe dry-run)'

- stage: ValidateSdk
  displayName: Validate Arcade SDK
  dependsOn: build
  jobs:
  - template: /eng/validate-sdk.yml@self
    parameters:
      microbuildUseESRP: ${{ parameters.microbuildUseESRP }}
      buildArgs: -configuration $(_BuildConfig)
        -prepareMachine
        $(_InternalBuildArgs)
        /p:Test=false

- template: /eng/common/templates-official/post-build/post-build.yml@self
  parameters:
    publishingInfraVersion: 3
    # signing validation will not run, even if the below value is 'true', if the 'PostBuildSign' variable is set to 'true'
    enableSigningValidation: false
    # Sourcelink validation isn't passing for Arcade due to some regressions. This should be
    # enabled back once this issue is resolved: https://github.com/dotnet/arcade/issues/2912
    enableSourceLinkValidation: false
    publishDependsOn:
    - Validate
    - ValidateSdk
