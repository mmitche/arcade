parameters:
  # Azure DevOps service connection name for ESRP signing (ESRP CLI only)
  serviceConnectionName: 'DotNetBuildESRP'
  # Service connection GUID for federated token auth (ESRP CLI only)
  serviceConnectionGuid: '4171f9a7-af33-4d84-8daf-2d0185625062'
  # Signing config file path
  configPath: ''
  # Input files / glob patterns (semicolon-separated)
  inputs: ''
  # ESRP client account identifier (passed as --esrp-client-id)
  esrpId: '28ec6507-2167-4eaa-a294-34408cf5dd0e'
  # App registration client ID for ESRP auth (passed as --esrp-app-registration)
  esrpClientId: '0ecbcdb7-8451-4cbe-940a-4ed97b08b955'
  # App registration tenant ID (passed as --esrp-tenant-id)
  esrpTenantId: '975f013f-7f24-47e8-a7d3-abc4752bf346'
  # Key vault name for the ESRP auth signing certificate (ESRP CLI only)
  keyVaultName: 'DotNetEngKeyVault'
  # Certificate name in the key vault (ESRP CLI only)
  certName: 'DotNet-ESRP-AuthSignCert'
  # Signing provider: 'esrp-cli' or 'esrp-client'
  provider: 'esrp-cli'
  # Dry-run mode (true/false)
  dryRun: false
  # Display name suffix for the pipeline step
  displayNameSuffix: ''

steps:
# ── ESRP CLI provider: uses AzureCLI@2 for federated token auth ──
- ${{ if eq(parameters.provider, 'esrp-cli') }}:
  - task: AzureCLI@2
    displayName: 'Recursive Sign${{ parameters.displayNameSuffix }}'
    inputs:
      azureSubscription: ${{ parameters.serviceConnectionName }}
      scriptType: 'ps'
      scriptLocation: 'inlineScript'
      inlineScript: |
        $cliDll = "$(System.DefaultWorkingDirectory)\artifacts\bin\Microsoft.DotNet.RecursiveSigning.Cli\$(_BuildConfig)\net10.0\Microsoft.DotNet.RecursiveSigning.Cli.dll"
        $dotnet = "$(System.DefaultWorkingDirectory)\.dotnet\dotnet.exe"

        # Copy input files to a staging directory so ESRP can overwrite them
        # (original files may be locked by the running dotnet process).
        $stageDir = Join-Path "$(Agent.TempDirectory)" "recursive-sign-esrp-cli"
        New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

        $inputArgs = @()
        $inputs = "${{ parameters.inputs }}".Split(';', [System.StringSplitOptions]::RemoveEmptyEntries)
        foreach ($input in $inputs) {
          $src = $input.Trim()
          $dest = Join-Path $stageDir (Split-Path $src -Leaf)
          Copy-Item -Path $src -Destination $dest -Force
          Write-Host "Staged: $src -> $dest"
          $inputArgs += "--input"
          $inputArgs += $dest
        }

        $dryRunFlag = @()
        if ("${{ parameters.dryRun }}" -eq "true") { $dryRunFlag += "--dry-run" }

        $providerArgs = @(
          "--esrp-cli",
          "--federated-token",
          "--service-connection-id", "${{ parameters.serviceConnectionGuid }}",
          "--esrp-client-id",       "${{ parameters.esrpId }}",
          "--esrp-app-registration", "${{ parameters.esrpClientId }}",
          "--esrp-tenant-id",       "${{ parameters.esrpTenantId }}",
          "--esrp-keyvault-name",   "${{ parameters.keyVaultName }}",
          "--esrp-cert-name",       "${{ parameters.certName }}"
        )

        Write-Host "Provider: esrp-cli"
        Write-Host "Inputs: ${{ parameters.inputs }}"
        Write-Host "Dry-run: ${{ parameters.dryRun }}"

        & $dotnet $cliDll `
          --config "${{ parameters.configPath }}" --verbose `
          @providerArgs @dryRunFlag @inputArgs

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Recursive signing CLI (ESRP CLI) failed with exit code $LASTEXITCODE"
          exit $LASTEXITCODE
        }
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

# ── ESRPClient.exe provider: uses cert-based auth via ESRP_AUTH_CONFIG env var ──
# MicroBuild installs the ESRP certs to LocalMachine\My store.
# The auth JSON follows the same pattern as C:\r\Sign\src\sign_v45\ESRPAuthenticator.cs.
- ${{ if eq(parameters.provider, 'esrp-client') }}:
  - task: PowerShell@2
    displayName: 'Recursive Sign${{ parameters.displayNameSuffix }}'
    inputs:
      targetType: 'inline'
      script: |
        $cliDll = "$(System.DefaultWorkingDirectory)\artifacts\bin\Microsoft.DotNet.RecursiveSigning.Cli\$(_BuildConfig)\net10.0\Microsoft.DotNet.RecursiveSigning.Cli.dll"
        $dotnet = "$(System.DefaultWorkingDirectory)\.dotnet\dotnet.exe"

        # Helper: find a certificate by partial subject name across both stores
        function Find-CertBySubject($subjectFragment) {
          foreach ($loc in @("LocalMachine", "CurrentUser")) {
            $store = New-Object System.Security.Cryptography.X509Certificates.X509Store("My", $loc)
            $store.Open("ReadOnly")
            $found = $store.Certificates | Where-Object { $_.Subject -like "*$subjectFragment*" } | Sort-Object NotAfter -Descending | Select-Object -First 1
            $store.Close()
            if ($found) {
              return @{ Cert = $found; StoreLocation = $loc }
            }
          }
          return $null
        }

        # Diagnostic: list all certificates in both stores
        foreach ($loc in @("LocalMachine", "CurrentUser")) {
          Write-Host "=== Certificates in ${loc}\My ==="
          $store = New-Object System.Security.Cryptography.X509Certificates.X509Store("My", $loc)
          $store.Open("ReadOnly")
          foreach ($cert in $store.Certificates) {
            Write-Host "  Subject: $($cert.Subject)  Thumbprint: $($cert.Thumbprint)  NotAfter: $($cert.NotAfter)"
          }
          $store.Close()
        }
        Write-Host "=== End Certificate Listing ==="

        # Find auth cert (SubjectName = "{ClientId}.microsoft.com")
        $authSubjectFragment = "${{ parameters.esrpClientId }}.microsoft.com"
        $authCertInfo = Find-CertBySubject $authSubjectFragment
        if ($authCertInfo) {
          $authSubjectName = $authSubjectFragment
          $authStoreLocation = $authCertInfo.StoreLocation
          Write-Host "Found auth cert in ${authStoreLocation}: $($authCertInfo.Cert.Subject)"
        } else {
          # Fallback: try just the client ID
          $authCertInfo = Find-CertBySubject "${{ parameters.esrpClientId }}"
          if ($authCertInfo) {
            # Use the actual subject from the found cert (strip "CN=" prefix if present)
            $rawSubject = $authCertInfo.Cert.Subject
            if ($rawSubject -match "CN=([^,]+)") { $authSubjectName = $matches[1] } else { $authSubjectName = $rawSubject }
            $authStoreLocation = $authCertInfo.StoreLocation
            Write-Host "Found auth cert (by clientId) in ${authStoreLocation}: $rawSubject -> using SubjectName: $authSubjectName"
          } else {
            Write-Host "WARNING: Auth cert not found for $authSubjectFragment — using default"
            $authSubjectName = "${{ parameters.esrpClientId }}.microsoft.com"
            $authStoreLocation = "LocalMachine"
          }
        }

        # Find request signing cert (SubjectName = "{EsrpClientId}")
        $reqSubjectFragment = "${{ parameters.esrpId }}"
        $reqCertInfo = Find-CertBySubject $reqSubjectFragment
        if ($reqCertInfo) {
          $rawSubject = $reqCertInfo.Cert.Subject
          if ($rawSubject -match "CN=([^,]+)") { $reqSubjectName = $matches[1] } else { $reqSubjectName = $rawSubject }
          $reqStoreLocation = $reqCertInfo.StoreLocation
          Write-Host "Found request signing cert in ${reqStoreLocation}: $rawSubject -> using SubjectName: $reqSubjectName"
        } else {
          Write-Host "WARNING: Request signing cert not found for $reqSubjectFragment — using default"
          $reqSubjectName = "${{ parameters.esrpId }}"
          $reqStoreLocation = "LocalMachine"
        }

        # Build auth JSON for ESRPClient.exe
        $authJson = @{
          Version = "1.0.0"
          ClientId = "${{ parameters.esrpClientId }}"
          EsrpClientId = "${{ parameters.esrpId }}"
          TenantId = "${{ parameters.esrpTenantId }}"
          AuthenticationType = "AAD_CERT"
          AuthCert = @{
            SubjectName = $authSubjectName
            StoreLocation = $authStoreLocation
            StoreName = "My"
            SendX5c = $true
          }
          RequestSigningCert = @{
            SubjectName = $reqSubjectName
            StoreLocation = $reqStoreLocation
            StoreName = "My"
            SendX5c = $false
          }
        } | ConvertTo-Json -Compress
        Write-Host "Auth JSON: $authJson"
        $env:ESRP_AUTH_CONFIG = $authJson
        Write-Host "ESRP_AUTH_CONFIG set (cert-based AAD_CERT auth)"

        # Copy input files to a staging directory so ESRP can overwrite them
        $stageDir = Join-Path "$(Agent.TempDirectory)" "recursive-sign-esrp-client"
        New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

        $inputArgs = @()
        $inputs = "${{ parameters.inputs }}".Split(';', [System.StringSplitOptions]::RemoveEmptyEntries)
        foreach ($input in $inputs) {
          $src = $input.Trim()
          $dest = Join-Path $stageDir (Split-Path $src -Leaf)
          Copy-Item -Path $src -Destination $dest -Force
          Write-Host "Staged: $src -> $dest"
          $inputArgs += "--input"
          $inputArgs += $dest
        }

        $dryRunFlag = @()
        if ("${{ parameters.dryRun }}" -eq "true") { $dryRunFlag += "--dry-run" }

        # No explicit auth args needed — ESRP_AUTH_CONFIG env var is read by the provider
        $providerArgs = @("--esrp-client")

        Write-Host "Provider: esrp-client (bundled, cert auth via ESRP_AUTH_CONFIG)"
        Write-Host "Inputs: ${{ parameters.inputs }}"
        Write-Host "Dry-run: ${{ parameters.dryRun }}"

        & $dotnet $cliDll `
          --config "${{ parameters.configPath }}" --verbose `
          @providerArgs @dryRunFlag @inputArgs

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Recursive signing CLI (ESRPClient.exe) failed with exit code $LASTEXITCODE"
          exit $LASTEXITCODE
        }
